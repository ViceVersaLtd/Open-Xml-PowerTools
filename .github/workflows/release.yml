name: Release

on:
  push:
    branches:
      - main
      - vNext-Latest
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: >
          dotnet pack OpenXmlPowerTools/OpenXmlPowerTools.csproj
          --configuration Release
          --output ./nupkg
          -p:Version=1.0.${{ github.run_number }}
          -p:PackageVersion=1.0.${{ github.run_number }}

      - name: Push to BaGet
        env:
          BAGET_API_KEY: ${{ secrets.BAGET_API_KEY }}
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --source "https://viceversa.nz/baget/v3/index.json"
          --api-key "$env:BAGET_API_KEY"
          --skip-duplicate
